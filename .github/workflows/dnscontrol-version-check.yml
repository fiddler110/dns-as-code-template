name: DNSControl Version Check

on:
  schedule:
    - cron: "0 13 * * 1"   # weekly, Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_VERSION: "4.46.0"
    steps:
      - name: Compare pinned version against latest upstream release
        run: |
          set -euo pipefail
          latest=$(gh api repos/DNSControl/dnscontrol/releases/latest --jq .tag_name)
          latest="${latest#v}"
          echo "pinned=${PINNED_VERSION}" >> "$GITHUB_ENV"
          echo "latest=${latest}" >> "$GITHUB_ENV"
          if [ "${PINNED_VERSION}" = "${latest}" ]; then
            echo "Pinned version ${PINNED_VERSION} matches latest upstream release."
          else
            echo "::notice::Pinned dnscontrol ${PINNED_VERSION} is behind latest upstream ${latest}."
            echo "outdated=true" >> "$GITHUB_ENV"
          fi

      - name: Open or update tracking issue
        if: env.outdated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '### dnscontrol version check';
            const body = `${marker}\n\nPinned version \`${process.env.pinned}\` is behind the latest upstream release \`${process.env.latest}\`.\n\nSee https://github.com/DNSControl/dnscontrol/releases/tag/v${process.env.latest} for the changelog. Do not bump blindly — a major version bump needs its own changelog review and a careful \`dnscontrol preview\` against every managed zone.`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dnscontrol-version',
            });
            const existing = issues.data.find((i) => i.body && i.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `dnscontrol ${process.env.latest} is available (pinned: ${process.env.pinned})`,
                body,
                labels: ['dnscontrol-version'],
              });
            }
