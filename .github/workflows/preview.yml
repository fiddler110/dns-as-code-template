name: DNS Preview

on:
  pull_request:
    paths:
      - "dnsconfig.js"
      - "creds.json"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    # Read-only token only — this job must never see the write token, and
    # pull_request (not pull_request_target) keeps forked PRs from reaching
    # repo secrets at all.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dnscontrol
        env:
          DNSCONTROL_VERSION: "4.46.0"
        run: |
          curl -sSL "https://github.com/DNSControl/dnscontrol/releases/download/v${DNSCONTROL_VERSION}/dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz" \
            | tar -xz dnscontrol
          sudo mv dnscontrol /usr/local/bin/dnscontrol
          dnscontrol version

      - name: Run dnscontrol preview
        id: preview
        run: |
          set -o pipefail
          dnscontrol preview 2>&1 | tee preview_output.txt

      - name: Comment preview result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('preview_output.txt', 'utf8').slice(0, 60000);
            const body = `### dnscontrol preview\n\n\`\`\`\n${output}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
