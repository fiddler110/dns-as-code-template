name: Python Tests

# Broader than preview.yml's dnsconfig.js-only filter on purpose: lint and the
# test suite need to run whenever scripts/dnsctl.py itself changes, which is
# exactly when they're most likely to catch something.
on:
  push:
    paths:
      - "dnsconfig.js"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "dnsconfig.js"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Run dnsctl lint
        run: python scripts/dnsctl.py lint

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check scripts/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run test suite
        run: pytest tests/ -v
